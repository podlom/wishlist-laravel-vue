services:
  swagger-ui:
    image: docker.swagger.io/swaggerapi/swagger-ui:latest
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      SWAGGER_JSON: /openapi/openapi.yaml
      VALIDATOR_URL: "none"
    volumes:
      - ./docs/openapi.yaml:/openapi/openapi.yaml:ro
    restart: unless-stopped

  swagger-editor:
    image: docker.swagger.io/swaggerapi/swagger-editor:latest
    ports:
      - "127.0.0.1:8082:80"
    environment:
      SWAGGER_FILE: /openapi/openapi.yaml
    volumes:
      - ./docs/openapi.yaml:/openapi/openapi.yaml:ro
    restart: unless-stopped

  openapi-lint:
    image: redocly/cli:latest
    working_dir: /spec
    volumes:
      - ./docs:/spec:ro
    command:
      - lint
      - openapi.yaml
      - --extends=spec
    profiles:
      - tools