name: Backend CI

on:
  push:
    branches:
      - main
      - feature/wishlist-api
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  php-tests:
    name: PHPUnit and Laravel Pint
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3, bcmath, xml
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare Laravel environment
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Check PHP formatting
        run: php vendor/bin/pint --test

      - name: Run PHPUnit
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
        run: php artisan test

  openapi-validation:
    name: OpenAPI validation
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Validate OpenAPI specification
        run: |
          docker compose \
            -f compose.openapi.yaml \
            run --rm --no-deps openapi-lint

  mysql-integration:
    name: MySQL 8.4 Integration Tests
    runs-on: ubuntu-24.04

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root_test_password
          MYSQL_DATABASE: wishlist_test
          MYSQL_USER: wishlist_test
          MYSQL_PASSWORD: wishlist_test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot_test_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql, bcmath, xml
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare Laravel environment
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Verify MySQL PDO driver
        env:
          APP_ENV: testing
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: wishlist_test
          DB_USERNAME: wishlist_test
          DB_PASSWORD: wishlist_test_password
        run: |
          php -r '
          require "vendor/autoload.php";
          $app = require "bootstrap/app.php";
          $app->make(\Illuminate\Contracts\Console\Kernel::class)->bootstrap();
          $driver = \Illuminate\Support\Facades\DB::connection()
              ->getPdo()->getAttribute(\PDO::ATTR_DRIVER_NAME);
          echo "Active PDO driver: $driver\n";
          if ($driver !== "mysql") {
              fwrite(STDERR, "Expected MySQL driver\n");
              exit(1);
          }
          '

      - name: Run MySQL integration tests
        env:
          APP_ENV: testing
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: wishlist_test
          DB_USERNAME: wishlist_test
          DB_PASSWORD: wishlist_test_password
        run: php artisan test
